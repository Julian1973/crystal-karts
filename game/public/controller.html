<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101d32">
<title>Crystal Karts Controller</title>
<style>
:root{--bg:#101d32;--card:#1b2d4b;--ink:#fff;--muted:#b9c8e6;--gold:#ffd66e;--accent:#8ff4ff;--go:#b9ff6b;--stop:#b24a63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
main{min-height:100%;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:1.3rem;color:var(--gold)}
p{margin:0;color:var(--muted)}
.hidden{display:none!important}
input,button{font:inherit;color:inherit}
#join-form{display:flex;gap:8px}
#code{flex:1;min-width:0;padding:12px;border-radius:12px;border:2px solid #34507f;background:var(--card);font-size:1.3rem;letter-spacing:.2em;text-transform:uppercase}
.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--card);font-weight:800}
#bears{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#bears button{border:3px solid transparent;border-radius:16px;background:var(--card);padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800}
#bears button img{width:100%;max-width:92px;aspect-ratio:1;object-fit:cover;border-radius:12px}
#bears button:disabled{opacity:.45}
#pad{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto minmax(0,1fr) minmax(0,1fr) auto;gap:10px;min-height:420px}
#pad .bar{grid-column:1/-1;display:flex;align-items:center;gap:10px}
#pad .bar img{width:44px;height:44px;border-radius:50%;border:3px solid var(--me,#fff)}
#pad .bar strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}#pad .bar .btn{padding:10px 12px}
.key{border:0;border-radius:20px;font-size:1.6rem;font-weight:900;background:var(--card);box-shadow:inset 0 -5px 0 #0004;display:grid;place-items:center}
.key.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 #0004;filter:brightness(1.3)}
#left{grid-column:1;grid-row:2/4}#right{grid-column:2;grid-row:2/4}
#drive{grid-column:3;grid-row:2;background:var(--go);color:#17310a}
#brake{grid-column:3;grid-row:3;background:var(--stop)}
#extras{grid-column:1/-1;grid-row:4;display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
#power{background:linear-gradient(135deg,#a879f2,#6fd6ff);font-size:1.3rem;padding:16px}
#drift,#recover{font-size:1rem;padding:16px 8px}
#status{min-height:1.4em;font-weight:700;color:var(--accent)}
@media (orientation:landscape){#pad{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2.2fr) minmax(0,1.3fr);grid-template-rows:auto minmax(0,1fr) minmax(0,1fr)}#drive{grid-column:4;grid-row:2}#brake{grid-column:4;grid-row:3}#extras{grid-column:3;grid-row:2/4;grid-template-columns:1fr;grid-template-rows:2fr 1fr 1fr}#pad{min-height:0}main{height:100%}}
</style>
</head>
<body>
<main>
  <h1>✦ Crystal Karts controller</h1>
  <p id="intro">Your phone is the steering wheel. Watch the race on the big screen.</p>
  <form id="join-form" class="hidden"><input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ROOM CODE" aria-label="Room code"><button class="btn" id="code-go">Next</button></form>
  <section id="pick" class="hidden" aria-label="Choose your bear"><p>Choose your bear</p><div id="bears"></div></section>
  <section id="pad" class="hidden" aria-label="Controls">
    <div class="bar"><img id="me-img" alt=""><strong id="me-name"></strong><button class="btn" id="tilt" aria-pressed="false">Tilt: off</button><button class="btn" id="leave">Leave</button></div>
    <button class="key" id="left" aria-label="Steer left">◀</button>
    <button class="key" id="right" aria-label="Steer right">▶</button>
    <div id="extras"><button class="key" id="power">✦ Power</button><button class="key" id="drift">Drift</button><button class="key" id="recover">Help me back</button></div>
    <button class="key" id="drive">▲ Drive</button>
    <button class="key" id="brake">Brake</button>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="controller.js?v=78"></script>
</body>
</html>
